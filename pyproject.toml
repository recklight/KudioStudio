[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kudiostudio"
dynamic = ["version"]
description = "A desktop workbench for the Kudio audio toolkit — inspect, edit, synthesize and measure audio."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "RL" }]
keywords = ["audio", "gui", "pywebview", "spectrogram", "speech-enhancement", "dsp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dependencies = [
    # 3.7.1 is the first kudio whose eval_metrics takes pesq_scale, and the
    # Metrics panel passes it
    "kudio[viz]>=3.7.1",
    # playback and fixed-length recording
    "sounddevice>=0.4.5",
    # the open-ended take, kudio.StreamRecorder. PyPI has PyAudio wheels for
    # Windows only; anywhere else pip compiles it against PortAudio's headers,
    # and a plain install should never need a compiler, so there it is the
    # [audio] extra instead
    "PyAudio>=0.2.13; sys_platform == 'win32'",
    # the window: a page served from this process, shown in the system's own
    # web view (WebView2 on Windows, WebKit on macOS). Where pywebview finds
    # no web view to draw with, the page opens in the default browser instead
    "pywebview>=5",
    "numpy>=1.22",
]

[project.optional-dependencies]
# recording until stopped, on Linux and macOS: needs PortAudio's headers
# (portaudio19-dev, or brew install portaudio) and a C compiler
audio = ["PyAudio>=0.2.13"]
eval = ["kudio[eval]>=3.7.1"]
# DNSMOS in the Metrics panel. The weights are NOT bundled -- see
# kudio.find_dnsmos_model for where to get them.
dnsmos = ["kudio[dnsmos]>=3.7.1"]
# learned models in the Enhance and Compare panels; pulls in PyTorch, hence
# optional
enhance = ["kudioenhance>=1.0"]
all = ["kudiostudio[audio,eval,dnsmos,enhance]"]
dev = ["kudiostudio[eval]", "pytest>=7.0"]

[project.scripts]
kudiostudio = "kudiostudio.__main__:main"

[project.urls]
Homepage = "https://github.com/recklight/KudioStudio"
Issues = "https://github.com/recklight/KudioStudio/issues"
Kudio = "https://pypi.org/project/kudio/"

[tool.setuptools.dynamic]
version = { attr = "kudiostudio.__version__" }

[tool.setuptools.packages.find]
include = ["kudiostudio*"]

# the window's icon, read at run time, and its page
[tool.setuptools.package-data]
kudiostudio = ["assets/*.png", "assets/*.ico", "web/static/*.html", "web/static/css/*.css",
               "web/static/js/*.js", "web/static/js/panels/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
