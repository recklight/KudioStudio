[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kudiostudio"
dynamic = ["version"]
description = "A desktop workbench for the Kudio audio toolkit — inspect, edit, synthesize and measure audio."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "RL" }]
keywords = ["audio", "gui", "pyside6", "spectrogram", "speech-enhancement", "dsp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dependencies = [
    # 3.7.1 is the first kudio whose eval_metrics takes pesq_scale, and the
    # Metrics panel passes it
    "kudio[viz]>=3.7.1",
    # playback and fixed-length recording
    "sounddevice>=0.4.5",
    # the open-ended take, kudio.StreamRecorder. PyPI has PyAudio wheels for
    # Windows only; anywhere else pip compiles it against PortAudio's headers,
    # and a plain install should never need a compiler, so there it is the
    # [audio] extra instead
    "PyAudio>=0.2.13; sys_platform == 'win32'",
    # QtCore, QtGui, QtWidgets, QtSvg and QtOpenGL are all this needs. The
    # PySide6 package adds WebEngine and the rest, about 430 MB more
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13",
    "numpy>=1.22",
]

[project.optional-dependencies]
# recording until stopped, on Linux and macOS: needs PortAudio's headers
# (portaudio19-dev, or brew install portaudio) and a C compiler
audio = ["PyAudio>=0.2.13"]
eval = ["kudio[eval]>=3.7.1"]
# DNSMOS in the Metrics panel. The weights are NOT bundled -- see
# kudio.find_dnsmos_model for where to get them.
dnsmos = ["kudio[dnsmos]>=3.7.1"]
# learned models in the Enhance and Compare panels; pulls in PyTorch, hence
# optional
enhance = ["kudioenhance>=1.0"]
# the browser-built window, python -m kudiostudio.web; on Windows it draws
# with the WebView2 runtime that ships with the system
web = ["pywebview>=5"]
all = ["kudiostudio[audio,eval,dnsmos,enhance,web]"]
dev = ["kudiostudio[eval]", "pytest>=7.0", "pytest-qt>=4.2"]

[project.scripts]
kudiostudio = "kudiostudio.__main__:main"

[project.urls]
Homepage = "https://github.com/recklight/KudioStudio"
Issues = "https://github.com/recklight/KudioStudio/issues"
Kudio = "https://pypi.org/project/kudio/"

[tool.setuptools.dynamic]
version = { attr = "kudiostudio.__version__" }

[tool.setuptools.packages.find]
include = ["kudiostudio*"]

# the window icons, read at run time, and the browser window's page
[tool.setuptools.package-data]
kudiostudio = ["assets/*.png", "assets/*.ico", "web/static/*.html", "web/static/css/*.css",
               "web/static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
