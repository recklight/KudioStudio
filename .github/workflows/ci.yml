name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # headless Qt: the suite and the end-to-end script both build real windows
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for 3.9: newer runner images no longer carry a CPython 3.9.
          # It also gets the oldest PySide6 that still supports 3.9, which is
          # where two of this suite's Qt object-lifetime bugs first showed
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries (Qt's EGL/xkb, PortAudio for PyAudio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libportaudio2 portaudio19-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: End-to-end checks
        # the combinations the unit suites do not reach: real files at
        # non-default rates, the kudio CLI, the window driving a worker thread
        run: python tools/smoke.py

  learned-models:
    # The Enhance and Compare panels' learned-model path, against a real
    # one-epoch kudio-enhance run. Neither package is on PyPI, so it comes
    # from GitHub, on a CPU-only PyTorch.
    runs-on: ubuntu-latest
    env:
      # a learned test that skips here fails instead: a job whose every
      # learned test skipped would otherwise pass and prove nothing
      KUDIOSTUDIO_REQUIRE_LEARNED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libportaudio2 portaudio19-dev
      - name: Install with kudio-enhance
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kudio-enhance @ git+https://github.com/recklight/KudioEnhance"
          pip install -e ".[dev,enhance]"
      - name: Run every learned-model test (they must run, not skip)
        run: pytest -q -m learned -rs
