name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # PowerShell would judge a multi-line step by its last command only
        shell: bash
    env:
      # the Windows runner's console is cp1252; anything outside it in a
      # message would raise UnicodeEncodeError instead of printing
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for 3.9: newer runner images no longer carry a CPython 3.9
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: PortAudio for sounddevice
        # no portaudio19-dev: PyAudio is only installed by default on Windows,
        # so the Linux jobs run the suite the way a plain Linux install has it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: End-to-end checks
        # the combinations the unit suites do not reach: real files at
        # non-default rates, the kudio CLI, the window's server driving a job
        run: python tools/smoke.py

  learned-models:
    # The Enhance and Compare panels' learned-model path, against a real
    # one-epoch kudioenhance run, from PyPI as a user would get it, on a
    # CPU-only PyTorch.
    runs-on: ubuntu-latest
    env:
      # a learned test that skips here fails instead: a job whose every
      # learned test skipped would otherwise pass and prove nothing
      KUDIOSTUDIO_REQUIRE_LEARNED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PortAudio for sounddevice
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - name: Install with kudioenhance
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,enhance]"
      - name: Run every learned-model test (they must run, not skip)
        run: pytest -q -m learned -rs

  publish:
    # build sdist+wheel and upload to PyPI when a v* tag is pushed
    needs: [test, learned-models]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing (no API token in secrets)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches kudiostudio/__init__.py
        # A mislabeled tag -- v1.1 cut from a tree that still says 1.0 -- is
        # caught here rather than on PyPI, which never lets a version number
        # be used twice. The version is read out of the file: nothing is
        # installed yet, so importing the package would fail for the wrong
        # reason.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(sed -n 's/^__version__ = "\([^"]*\)".*$/\1/p' kudiostudio/__init__.py)
          if [ -z "$version" ]; then
            echo "found no __version__ = \"...\" line in kudiostudio/__init__.py to check the tag against." >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match kudiostudio/__init__.py, which says $version." >&2
            echo "Move the tag onto a commit whose __init__.py says $tag, or bump it and tag again." >&2
            exit 1
          fi
          echo "releasing $version"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the built metadata, and that the icon and the page are in the wheel
        run: |
          twine check --strict dist/*
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); missing = [n for n in ('kudiostudio/assets/logo.png', 'kudiostudio/web/static/index.html', 'kudiostudio/web/static/js/main.js', 'kudiostudio/web/static/js/panels/batch.js', 'kudiostudio/web/static/css/app.css') if n not in names]; assert not missing, missing"
      - name: PortAudio for sounddevice
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - name: Import every module out of the built wheel
        # twine check imports nothing, so a module that fails on import goes
        # straight to PyPI without this. The walk runs outside the checkout,
        # so `import kudiostudio` can only find the wheel just installed.
        run: |
          pip install dist/*.whl
          kudiostudio --help > /dev/null
          mkdir -p "$RUNNER_TEMP/import-walk"
          cd "$RUNNER_TEMP/import-walk"
          python - <<'PY'
          import importlib
          import pkgutil

          import kudiostudio

          broken = []
          for found in pkgutil.walk_packages(kudiostudio.__path__, "kudiostudio."):
              try:
                  importlib.import_module(found.name)
              except Exception as exc:
                  broken.append("{}: {}: {}".format(found.name, type(exc).__name__, exc))
          if broken:
              raise SystemExit("these modules do not import from the wheel:\n  "
                               + "\n  ".join(broken))
          print("every module under kudiostudio imports from the wheel")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
